name: Build AI Market Brain APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: unzip -o AI_Market_Brain_Android_Prototype.zip

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Fix Java JVM target
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle

      - name: Build APK
        run: gradle assembleDebug

      - name: Find APK
        run: |
          mkdir -p artifacts
          APK=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" artifacts/AI-Market-Brain.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Market-Brain-APK
          path: artifacts/AI-Market-Brain.apk
